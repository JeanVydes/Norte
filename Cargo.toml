[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "benchmarks/agent-cost",
    "benchmarks/cache-hit",
    "benchmarks/latency",
    "benchmarks/long-context",
    "benchmarks/roundtrip-fidelity",
    "benchmarks/schema-friction",
    "benchmarks/support",
    "benchmarks/token-counting",
    "benchmarks/tool-loop",
    "benchmarks/transport-retry",
    "examples/cookbook",
    "norte",
    "norte-facade-smoke",
    "norte-macros",
    "norte-core",
    "norte-http",
    "norte-anthropic",
    "norte-openai",
    "norte-gemini",
    "norte-tools",
    "norte-media",
    "norte-testing",
    "norte-mcp",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JeanVydes/Norte"
homepage = "https://jeanvydes.github.io/Norte/"
authors = ["Jean Vides <j@vyde.dev>"]

[workspace.dependencies]
norte-macros = { path = "norte-macros", version = "0.0.2" }
norte-core = { path = "norte-core", version = "0.0.2" }
norte-http = { path = "norte-http", version = "0.0.2" }
norte-anthropic = { path = "norte-anthropic", version = "0.0.2" }
norte-openai = { path = "norte-openai", version = "0.0.2" }
norte-gemini = { path = "norte-gemini", version = "0.0.2" }
norte-tools = { path = "norte-tools", version = "0.0.2" }
norte-media = { path = "norte-media", version = "0.0.2" }
norte-testing = { path = "norte-testing", version = "0.0.2" }
norte-mcp = { path = "norte-mcp", version = "0.0.2" }
norte-bench-support = { path = "benchmarks/support", version = "0.0.2" }

tokio-tungstenite = "0.26"

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.1.0"
thiserror = "2.0.17"
strum = { version = "0.27", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22.1"
bytes = "1"
async-trait = "0.1.89"
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "multipart"] }
url = "2.5.7"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
