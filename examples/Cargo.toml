[package]
name = "rustychain-examples"
version = "0.1.0"
edition = "2024"

[dependencies]
schemars = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.31"
rustychain = { path = "../rustychain", features = ["full"] }
rustychain-tools-suite = { path = "../rustychain-tools-suite" }
async-trait = "0.1.89"
rmcp = { version = "0.12.0", features = [
    "client",
    "schemars",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
] }