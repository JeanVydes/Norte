[package]
name = "norte-cookbook"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Small, runnable recipes for Norte: the core alone at the root."

[dependencies]
norte-core = { path = "../../norte-core" }
norte-http = { path = "../../norte-http" }
norte-openai = { path = "../../norte-openai" }
norte-tools = { path = "../../norte-tools" }
# The recipes drive the ports directly, so a scripted model is the honest stand-in.
norte-testing = { path = "../../norte-testing" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
schemars = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }


# Not a workspace member on purpose: the recipes are read and copied, not
# published. An empty [workspace] keeps Cargo from claiming the parent one.
[workspace]
