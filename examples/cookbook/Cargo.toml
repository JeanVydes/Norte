[package]
name = "norte-cookbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Small, runnable recipes for Norte: the core alone at the root, the harness and media in their own folders."

[dependencies]
norte-core = { workspace = true }
norte-harness = { workspace = true }
norte-http = { workspace = true }
norte-openai = { workspace = true }
norte-tools = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

# Nested under a topic folder, which Cargo's autodiscovery does not reach.
[[example]]
name = "agent"
path = "examples/harness/agent/main.rs"

