[package]
name = "norte-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
norte-anthropic = { path = "../norte-anthropic", features = ["fuzz"] }
norte-core = { path = "../norte-core" }
norte-gemini = { path = "../norte-gemini", features = ["fuzz"] }
norte-http = { path = "../norte-http" }
norte-openai = { path = "../norte-openai", features = ["fuzz"] }

[[bin]]
name = "anthropic_messages"
path = "fuzz_targets/anthropic_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_responses"
path = "fuzz_targets/openai_responses.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_chat"
path = "fuzz_targets/openai_chat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gemini_generate"
path = "fuzz_targets/gemini_generate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false
bench = false

[workspace]
