[book]
title = "RustyChain"
authors = ["Jean Vides"]
language = "en"
src = "src"
description = "Provider-agnostic infrastructure for LLM agents in Rust."

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/JeanVydes/rustychain"
edit-url-template = "https://github.com/JeanVydes/rustychain/edit/dev/guide/{path}"
no-section-label = true
smart-punctuation = true

[output.html.search]
enable = true
