[package]
name = "norte-gemini"
description = "Google Gemini client: generateContent with streaming, function calls, safety ratings and cached content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["gemini", "google", "llm", "multimodal", "function-calling"]
