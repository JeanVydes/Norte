[package]
name = "norte"
description = "The Norte facade: build AI agents in Rust with OpenAI, Anthropic and Gemini adapters, durable sessions, streaming and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://jeanvydes.github.io/Norte/"
authors.workspace = true
readme = "../README.md"
keywords = ["llm", "ai-agents", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous"]

# Every provider and helper on the docs page, not just the default feature.
[package.metadata.docs.rs]
all-features = true

[dependencies]
norte-macros = { workspace = true }
norte-core = { workspace = true }
norte-http = { workspace = true, optional = true }
norte-openai = { workspace = true, optional = true }
norte-anthropic = { workspace = true, optional = true }
norte-gemini = { workspace = true, optional = true }
norte-tools = { workspace = true, optional = true }
norte-mcp = { workspace = true, optional = true }
norte-testing = { workspace = true, optional = true }

[features]
default = ["openai"]
# The transport is pulled in by any provider, and re-exported as `norte::http`
# for a host that builds its own profile.
http = ["dep:norte-http"]
openai = ["dep:norte-openai", "http"]
anthropic = ["dep:norte-anthropic", "http"]
gemini = ["dep:norte-gemini", "http"]
google = ["gemini"]
tools = ["dep:norte-tools"]
media = ["norte-core/media"]
mcp = ["dep:norte-mcp"]
# Test helpers are opt-in: they are not part of what an application ships.
testing = ["dep:norte-testing"]
full = ["openai", "anthropic", "gemini", "tools", "media", "mcp"]

[dev-dependencies]
async-trait = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true

# The facade smoke test exercises the `tools` feature exports; without the
# feature the prelude has no tool suite to check.
[[test]]
name = "facade_smoke"
path = "tests/facade_smoke.rs"
required-features = ["tools"]
