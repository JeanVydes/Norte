[package]
name = "rustychain-tools-suite"
version = "0.1.0"
edition = "2024"

[dependencies]
rustychain = { path = "../rustychain", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.1.0"
thiserror = "2.0.17"
arrayvec = "0.7.2"
uuid = { version = "1", features = ["v4"] }

# Logging
log = "0.4.20"
url = "2.5.7"

# Async and Futures
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"
async-recursion = "1"
urlencoding = { version = "2.1.3" }
scraper = { version = "0.25.0" }
reqwest = { version = "0.12.25", features = ["json", "cookies"] }
rand = "0.9.2"
fastrand = "2.3"
chrono = { version = "0.4" }
chrono-tz = { version = "0.10.4" }
similar = { version = "2.7.0" }
trust-dns-resolver = { version = "0.23.2" }
meval = { version = "0.2.0" }
regex = { version = "*" }
lettre = { version = "0.11.9", features = ["builder"] }
bson = { version = "3.1.0" }
mongodb = { version = "3.4.1" }
rmcp = { version = "0.12.0", features = [
    "client",
    "schemars",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
] }
tree-sitter = "0.20.8"
tree-sitter-language = "0.1.6"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-javascript = "0.25.0"

[dev-dependencies]
mockito = "1.2.0"