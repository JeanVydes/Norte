[package]
name = "rustychain"
version = "0.0.1"
edition = "2024"
description = "A Rust library for building LLM-powered applications"
license = "MIT"
homepage = "https://github.com/JeanVydes/rustychain"
repository = "https://github.com/JeanVydes/rustychain"
documentation = "https://docs.rs/rustychain"
readme = "README.md"
keywords = ["llm", "ai", "agent"]
categories = ["api-bindings", "asynchronous", "database"]
authors = ["Jean Vides <j@lojur.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.1.0"
thiserror = "2.0.17"
arrayvec = "0.7.2"
uuid = { version = "1", features = ["v4"] }
secrecy = { version = "0.8", features = ["serde"] }

# Logging
log = "0.4.20"

# Async and Futures
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"
async-recursion = "1"

# LLM Providers

# Google Gemini, this crate is unofficial, but works well
gemini-rust = { version = "1.5.1", optional = true }
async-openai = { version = "0.32.2", features = ["full"], optional = true }

# Tools
scraper = { version = "0.25.0" }
rand = "0.9.2"
fastrand = "2.3"
chrono = { version = "0.4" }
bson = { version = "3.1.0", optional = true }
mongodb = { version = "3.4.1", optional = true }

# Util
url = "2.5.7"
base64 = "0.22.1"

rustychain-macros = { path = "../rustychain-macros", optional = true }

# Storage
qdrant-client = { version = "1.16.0", optional = true }
pgvector = { version = "0.4.1", features = ["sqlx"], optional = true }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
], optional = true }

[features]
default = []

sql = ["dep:sqlx"]
postgres = ["sql", "sqlx/postgres", "dep:pgvector"]
qdrant = ["dep:qdrant-client"]
lancedb = []
mongodb = ["dep:mongodb", "dep:bson"]
s3vector = []
surrealdb = []

memory_store = []
vector_store = [
    "postgres",
    "qdrant",
    "lancedb",
    "mongodb",
    "s3vector",
    "surrealdb",
]
persistent_storage = ["vector_store"]
storage = ["memory_store", "persistent_storage"]

openai = ["async-openai"]
google = ["gemini-rust"]
anthropic = []
aws = []
providers = ["google", "anthropic", "aws", "openai"]

experimental = []
macros = ["rustychain-macros"]
essential = ["default", "providers", "macros"]
full = ["essential", "storage"]

[dev-dependencies]
testcontainers = "0.26.0"
rand = "0.9.2"
criterion = { version = "0.8.1", features = ["async_tokio"] }
